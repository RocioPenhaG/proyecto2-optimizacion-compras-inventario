services:
  db:
    image: postgres:16
    container_name: sgpk_db
    environment:
      POSTGRES_DB: sgpk
      POSTGRES_USER: sgpk
      POSTGRES_PASSWORD: sgpk123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sgpk_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
